<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
  :root{--bg:#0d1114;--panel:#151b21;--line:#2a3540;--txt:#e8edf2;--muted:#93a1ad;--accent:#4fd0d8}

  canvas{display:block}
  .top{position:fixed;top:0;left:0;right:0;padding:14px 20px;pointer-events:none;

<script>
const ROCK_TYPES={
  GRANITE:{id:10,name:"Granite",color:0xb9b9b9,hardness:999,desc:"Intrusive igneous — interlocking crystals, dozer can't cut"},
  LIMESTONE:{id:11,name:"Limestone",color:0xd4c8a0,hardness:25,desc:"Sedimentary — calcite-rich, breakable"},
  SANDSTONE:{id:12,name:"Sandstone",color:0xa87c52,hardness:10,desc:"Sedimentary — cemented sand grains, soft"},
  BASALT:{id:13,name:"Basalt",color:0x4a4a4a,hardness:999,desc:"Extrusive igneous — fine-grained, impenetrable"},
  SHALE:{id:14,name:"Shale",color:0x6b7a8c,hardness:3,desc:"Sedimentary — fissile, splits into thin sheets"}
};
const ALL_ROCKS=[ROCK_TYPES.GRANITE,ROCK_TYPES.LIMESTONE,ROCK_TYPES.SANDSTONE,ROCK_TYPES.BASALT,ROCK_TYPES.SHALE];
const hash=(a,b)=>{let h=(a*374761393+b*668265263)>>>0;h=(h^(h>>13))*1274126177;h=(h^(h>>16))>>>0;return (h&65535)/65535;};
const mat=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75,metalness:.05},o||{}));
const M={
  yel:mat(0xe0a62a,{roughness:.4,metalness:.12}),
  yelD:mat(0x8a6416,{roughness:.5,metalness:.08}),
  trk:mat(0x23262a,{roughness:.85,metalness:.05}),
  steel:mat(0x9aa0a6,{roughness:.35,metalness:.6}),
  dark:mat(0x2c2f33,{roughness:.55,metalness:.3}),
  rub:mat(0x191b1d,{roughness:.9,metalness:0}),
  glass:mat(0x9fd4e4,{transparent:true,opacity:.32,roughness:.1,metalness:.2})
};
function mq(g,geo,pos,c,rot){
  const m=new THREE.Mesh(geo,typeof c==='object'?c:mat(c));
  m.position.set(pos[0],pos[1],pos[2]);
  if(rot)m.rotation.set(rot[0],rot[1],rot[2]);
  m.castShadow=true;m.receiveShadow=true;g.add(m);return m;
}
function buildBackhoe(){
  const g=new THREE.Group();
  for(const s of[-1,1]){
    mq(g,new THREE.BoxGeometry(2.7,0.45,0.38),[s*0.82,0.28,0],M.trk);
    for(const z of[0.85,-0.85]){
      mq(g,new THREE.CylinderGeometry(0.25,0.25,0.34,14),[s*1.13,0.25,z],M.rub,[0,0,Math.PI/2]);
      mq(g,new THREE.CylinderGeometry(0.15,0.15,0.36,10),[s*1.13,0.25,z],M.steel,[0,0,Math.PI/2]);
    }
  }
  mq(g,new THREE.BoxGeometry(1.5,0.26,2.5),[0,0.6,0],M.yelD);
  mq(g,new THREE.BoxGeometry(1.3,0.9,1.4),[0,1.22,0.1],M.yel);
  mq(g,new THREE.BoxGeometry(1.1,0.5,0.03),[0,1.5,-0.8],M.glass);
  mq(g,new THREE.BoxGeometry(0.03,0.9,1.2),[0.64,1.22,0.1],M.glass);
  mq(g,new THREE.BoxGeometry(1.3,0.08,1.4),[0,1.72,0.1],M.dark);
  mq(g,new THREE.BoxGeometry(1.5,0.9,0.8),[0,1.12,-1.0],M.yel);
  mq(g,new THREE.CylinderGeometry(0.07,0.07,0.7,8),[0.5,2.05,-1.0],M.dark);
  for(const s of[-1,1]){
    mq(g,new THREE.BoxGeometry(0.12,0.1,1.6),[s*0.55,1.32,1.5],M.yelD,[0.9,0,0]);
    mq(g,new THREE.CylinderGeometry(0.05,0.05,1.1,8),[s*0.55,1.12,1.15],M.steel,[0,1.6,0]);
  }
  const fBucket=new THREE.Group();
  mq(fBucket,new THREE.BoxGeometry(1.6,0.55,0.5),[0,0.15,0.35],M.yelD);
  mq(fBucket,new THREE.BoxGeometry(1.6,0.22,0.3),[0,0.42,0.32],M.steel);
  fBucket.position.set(0,1.15,2.3);fBucket.rotation.x=-0.45;
  g.add(fBucket);
  const turret=new THREE.Group();
  mq(turret,new THREE.CylinderGeometry(0.5,0.55,0.45,14),[0,0.78,0],M.dark);
  mq(turret,new THREE.BoxGeometry(0.5,1.0,0.9),[0,0.95,0],M.yel);
  turret.position.set(0,0.5,-1.05);
  const arm=new THREE.Group();
  mq(arm,new THREE.BoxGeometry(0.35,0.5,1.7),[0,0.25,0.55],M.yel,[0.55,0,0]);
  mq(arm,new THREE.CylinderGeometry(0.05,0.05,1.3,8),[0,0.55,0.15],M.steel,[0.9,0,0]);
  const stick=new THREE.Group();
  mq(stick,new THREE.BoxGeometry(0.28,0.4,1.5),[0,0.2,0.55],M.yelD,[-1.35,0,0]);
  mq(stick,new THREE.CylinderGeometry(0.045,0.045,1.2,8),[0,0.5,0.1],M.steel,[-1.0,0,0]);
  const bucket=new THREE.Group();
  mq(bucket,new THREE.BoxGeometry(0.9,0.55,0.5),[0,0.1,0],M.yelD);
  mq(bucket,new THREE.BoxGeometry(0.9,0.18,0.28),[0,0.38,0.02],M.steel);
  for(const z of[-0.22,0.02])mq(bucket,new THREE.BoxGeometry(0.9,0.32,0.05),[0,0.26,z],M.dark);
  bucket.position.set(0,0,1.4);
  stick.add(bucket);
  arm.add(stick);
  turret.add(arm);
  g.add(turret);
  g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  return g;
}
function buildDumpTruck(){
  const g=new THREE.Group();
  for(const s of[-1,1])for(const z of[1.4,-1.4]){
    mq(g,new THREE.CylinderGeometry(0.55,0.55,0.45,12),[s*1.0,0.55,z],M.rub,[0,0,Math.PI/2]);
    mq(g,new THREE.CylinderGeometry(0.32,0.32,0.5,10),[s*1.0,0.55,z],M.steel,[0,0,Math.PI/2]);
  }
  mq(g,new THREE.BoxGeometry(2.5,0.35,4.4),[0,0.9,0],M.dark);
  mq(g,new THREE.BoxGeometry(2.3,1.5,1.6),[0,1.8,-1.2],M.yel);
  mq(g,new THREE.BoxGeometry(2.1,0.7,0.05),[0,1.9,-2.02],M.glass);
  const bed=new THREE.Group();
  mq(bed,new THREE.BoxGeometry(2.3,0.9,2.6),[0,0.45,0],M.yel);
  mq(bed,new THREE.BoxGeometry(2.1,0.6,2.4),[0,0.55,0.1],0x5a4a34);
  bed.position.set(0,1.25,0.9);
  g.add(bed);
  for(const s of[-1,1])
    mq(g,new THREE.CylinderGeometry(0.06,0.06,1.4,8),[s*0.9,2.4,-0.3],M.steel,[0.5,0,0]);
  g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  return g;
}
function buildLoader(){
  const g=new THREE.Group();
  for(const s of[-1,1])for(const z of[1.1,-1.1]){
    mq(g,new THREE.CylinderGeometry(0.7,0.7,0.5,12),[s*1.15,0.7,z],M.rub,[0,0,Math.PI/2]);
    mq(g,new THREE.CylinderGeometry(0.4,0.4,0.55,10),[s*1.15,0.7,z],M.steel,[0,0,Math.PI/2]);
  }
  mq(g,new THREE.BoxGeometry(2.6,0.8,3.0),[0,1.2,0],M.yel);
  mq(g,new THREE.BoxGeometry(1.4,0.9,1.3),[0,1.9,0.1],M.yel);
  mq(g,new THREE.BoxGeometry(1.2,0.6,0.05),[0,2.0,-0.6],M.glass);
  for(const s of[-1,1]){
    mq(g,new THREE.BoxGeometry(0.15,0.12,1.8),[s*0.85,1.5,1.7],M.yelD,[0.5,0,0]);
    mq(g,new THREE.CylinderGeometry(0.05,0.05,1.2,8),[s*0.85,1.35,1.2],M.steel,[0,0.9,0]);
  }
  const bucket=new THREE.Group();
  mq(bucket,new THREE.BoxGeometry(2.5,0.8,0.6),[0,0.2,0.3],M.yelD);
  mq(bucket,new THREE.BoxGeometry(2.5,0.3,0.35),[0,0.5,0.25],M.steel);
  bucket.position.set(0,1.35,2.7);bucket.rotation.x=-0.4;
  g.add(bucket);
  g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  return g;
}
function buildDrillRig(){
  const g=new THREE.Group();
  for(const zz of[-1.6,0.4,2.4])for(const s of[-1,1])
    mq(g,new THREE.CylinderGeometry(0.6,0.6,0.55,12),[s*1.15,0.6,zz],M.rub,[0,0,Math.PI/2]);
  mq(g,new THREE.BoxGeometry(2.8,0.5,5.6),[0,1.1,0],0x4a4036);
  mq(g,new THREE.BoxGeometry(2.6,1.6,1.8),[0,2.2,1.7],0x8d8472);
  mq(g,new THREE.BoxGeometry(2.2,0.7,0.1),[0,2.4,2.6],0x2e4a55);
  mq(g,new THREE.BoxGeometry(2.4,1.2,1.6),[0,1.8,-1.6],0xb9b4ab);
  mq(g,new THREE.BoxGeometry(1.6,1.0,1.4),[0,2.0,-2.2],0x4a4036);
  const mast=new THREE.Group();
  mq(mast,new THREE.BoxGeometry(0.9,9,0.9),[0,4.5,0],0xd8b25a);
  for(let h=0.5;h<9;h+=1.8)
    mq(mast,new THREE.BoxGeometry(1.6,0.3,1.6),[0,h,0],0xc9a14f);
  mq(mast,new THREE.CylinderGeometry(0.22,0.22,10,8),[0,5,0],0xb9b4ab);
  mast.position.set(0,2.4,-2.2);mast.rotation.x=-0.06;
  g.add(mast);
  mq(g,new THREE.BoxGeometry(0.9,0.9,0.9),[0,2.6,-2.2],0x31363a);
  for(let k=0;k<2;k++)
    mq(g,new THREE.BoxGeometry(1.6,0.55,0.85),[1.5,0.8+0.55*k,1.6],0x6d757c);
  g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  return g;
}
function placeMachine(builder,x,z,rotY){
  const g=builder();
  g.position.set(x,0,z);g.rotation.y=rotY;
  scene.add(g);
  return g;
}

const scene=new THREE.Scene();
// OSHA tip overlay for crane lifting and equipment operation
safetyNote = document.createElement("div");
safetyNote.className = "safety-note";
safetyNote.innerHTML = '<div style="position:absolute;right:12px;top:12px;background:rgba(0,0,0,.75);color:#fff;padding:9px 11px;border-radius:7px;font-family:monospace;font-size:10px;line-height:1.45;max-width:240;z-index:1000;">OSHA TIP: crane lifts require 1.5x load-factor, post-lift inspections, and trained signal persons. Wear hard hat, hi-vis, steel-toe boots.</div>';
document.body.appendChild(safetyNote);
function buildSky(){
  const cv=document.createElement('canvas');cv.width=16;cv.height=256;
  const g=cv.getContext('2d');
  const grad=g.createLinearGradient(0,0,0,256);
  grad.addColorStop(0,'#4a7fb5');
  grad.addColorStop(0.55,'#8fc0e8');
  grad.addColorStop(0.78,'#dceef7');
  grad.addColorStop(1,'#b9c9d4');
  g.fillStyle=grad;g.fillRect(0,0,16,256);
  scene.background=new THREE.CanvasTexture(cv);

}
buildSky();

const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,2000);
camera.position.set(60,38,110);

renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

renderer.toneMappingExposure=1.0;

fill.position.set(-25,18,-30);scene.add(fill);

sun.shadow.mapSize.set(2048,2048);

controls.maxDistance=1200;

function rockTexture(id){
  const cv=document.createElement('canvas');cv.width=cv.height=128;
  const g=cv.getContext('2d');
  const R=ROCK_TYPES;
  if(id===R.SHALE.id){
    g.fillStyle='#5d6775';g.fillRect(0,0,128,128);
    for(let i=0;i<90;i++){
      g.fillStyle='rgba('+((35+Math.random()*55)|0)+','+((45+Math.random()*55)|0)+','+((60+Math.random()*55)|0)+','+(0.25+Math.random()*0.5)+')';
      g.fillRect(0,(Math.random()*128)|0,128,1+Math.random()*2);
    }
  }else if(id===R.SANDSTONE.id){
    g.fillStyle='#c9a268';g.fillRect(0,0,128,128);
    for(let i=0;i<110;i++){
      g.fillStyle='rgba(70,40,15,'+(0.2+Math.random()*0.4)+')';
      g.beginPath();g.arc(Math.random()*128,Math.random()*128,Math.random()*1.6+0.4,0,6.29);g.fill();
    }
    for(let i=0;i<6;i++){
      g.fillStyle='rgba(130,95,50,'+(0.18+Math.random()*0.25)+')';
      g.fillRect(0,(Math.random()*128)|0,128,2+Math.random()*3);
    }
  }else if(id===R.GRANITE.id){
    g.fillStyle='#ece4d2';g.fillRect(0,0,128,128);
    const spots=['60,60,60','185,120,108','40,40,40','235,235,235'];
    for(let i=0;i<70;i++){
      g.fillStyle='rgba('+spots[i%4]+','+(0.5+Math.random()*0.4)+')';
      g.fillRect(Math.random()*122,Math.random()*122,3+Math.random()*6,3+Math.random()*6);
    }
  }else if(id===R.BASALT.id){
    g.fillStyle='#3b3e43';g.fillRect(0,0,128,128);
    for(let i=0;i<50;i++){
      g.fillStyle='rgba('+((45+Math.random()*60)|0)+','+((48+Math.random()*60)|0)+','+((55+Math.random()*65)|0)+',0.6)';
      g.beginPath();g.arc(Math.random()*128,Math.random()*128,Math.random()*6+1,0,6.29);g.fill();
    }
  }else{
    g.fillStyle='#d8d0c0';g.fillRect(0,0,128,128);
    for(let i=0;i<30;i++){
      g.fillStyle='rgba(202,194,176,'+(0.2+Math.random()*0.3)+')';
      g.beginPath();g.arc(Math.random()*128,Math.random()*128,Math.random()*11+2,0,6.29);g.fill();
    }
  }
  const t=new THREE.CanvasTexture(cv);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  return t;
}
function rockGeom(id,seed){
  const g=new THREE.DodecahedronGeometry(1,1);
  const p=g.attributes.position;
  const P={10:{a:.3,b:.22,f1:2.3,f2:3.1,s:.92},11:{a:.2,b:.17,f1:2.1,f2:2.7,s:1},
    12:{a:.26,b:.2,f1:2.5,f2:2.9,s:.95},13:{a:.15,b:.13,f1:1.9,f2:2.3,s:1.05},
    14:{a:.22,b:.18,f1:2.2,f2:2.6,s:.5}};
  const o=P[id]||P[12];
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    const len=Math.max(1e-4,Math.sqrt(x*x+y*y+z*z));
    const u=Math.atan2(z,x)/(Math.PI*2);
    const v=Math.asin(Math.max(-1,Math.min(1,y/len)))/Math.PI;
    const r=1+o.a*Math.sin(u*6.28*o.f1+seed)+o.b*Math.sin(v*Math.PI*o.f2+seed*2)
      +o.b*0.6*Math.sin(u*6.28*o.f1*2.5+v*Math.PI*o.f2*2.9+seed*3);
    p.setXYZ(i,x*r*o.s,y*r*o.s,z*r*o.s);
  }
  g.computeVertexNormals();
  return g;
}

function buildMountains(){
  const HALF=WORLD/2;
  const geo=new THREE.PlaneGeometry(WORLD,WORLD,230,230);
  const p=geo.attributes.position,col=new THREE.BufferAttribute(new Float32Array(p.count*3),3);
  const sm=new SimplexNoise();
  const c=new THREE.Color();
  const base=new THREE.Color(0x3f382c),grass=new THREE.Color(0x5c6b3e),
    rock=new THREE.Color(0x85806f),peak=new THREE.Color(0xb0b4b8),snow=new THREE.Color(0xe6ebef);
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),ly=p.getY(i);
    const d=Math.hypot(x,ly)/HALF;
    const t=Math.min(1,Math.max(0,(d-0.42)/0.58));
    const ramp=Math.pow(t,1.6);
    let n=0,a=1,sum=0;
    for(let o=0;o<6;o++){
      n+=a*sm.noise2D(x*0.0016+7,ly*0.0016+31);
      a*=0.5;sum+=a;
    }
    const h=ramp*(120+150*n/sum)+ramp*Math.max(0,sm.noise2D(x*0.004+100,ly*0.004-50))*60;
    p.setZ(i,h);
    if(h>210)c.copy(snow).lerp(peak,Math.min(1,(h-210)/60));
    else if(h>130)c.copy(peak).lerp(rock,(h-130)/80);
    else if(h>55)c.copy(rock).lerp(grass,1-(h-55)/75);
    else c.copy(grass).lerp(base,Math.min(1,1-h/55));
    const sh=0.72+0.3*Math.min(1,h/230)+0.15*(0.5+0.5*n/sum);
    c.multiplyScalar(Math.min(1.25,sh));
    col.setXYZ(i,c.r,c.g,c.b);
  }
  geo.setAttribute('color',col);
  geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,flatShading:true}));
  m.rotation.x=-Math.PI/2;
  m.position.y=-0.18;
  m.receiveShadow=true;
  scene.add(m);
}
buildMountains();

function rockLabel(id){
  const rt=ALL_ROCKS.find(r=>r.id===id);
  const cv=document.createElement('canvas');cv.width=640;cv.height=176;
  const g=cv.getContext('2d');
  g.clearRect(0,0,640,176);
  g.fillStyle='#f5f0e4';
  g.beginPath();
  g.moveTo(10,10);g.lineTo(630,10);g.lineTo(630,132);
  g.lineTo(330,132);g.lineTo(320,158);g.lineTo(310,132);
  g.lineTo(10,132);g.closePath();g.fill();
  g.strokeStyle='#3a4148';g.lineWidth=3;g.stroke();
  g.fillStyle=rt.color.toString(16).padStart(6,'0');
  g.beginPath();g.arc(46,66,30,0,6.29);g.fill();
  g.strokeStyle='#3a4148';g.lineWidth=2;g.beginPath();g.arc(46,66,30,0,6.29);g.stroke();
  g.fillStyle='#1c2228';g.font='bold 44px Georgia,serif';
  g.textAlign='left';g.textBaseline='middle';g.fillText(rt.name,96,46);
  g.fillStyle='#39444e';g.font='italic 24px Georgia,serif';
  g.fillText(rt.desc,96,96);
  const t=new THREE.CanvasTexture(cv);
  t.minFilter=THREE.LinearFilter;t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:true}));
  s.scale.set(9.6,2.64,1);
  return s;
}
function leaderLine(x0,y0,x1,y1){
  const g=new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(x0,y0,0),new THREE.Vector3(x1,y1,0)]);
  return new THREE.Line(g,new THREE.LineBasicMaterial({color:0xf5f0e4,transparent:true,opacity:0.85}));
}
function plinth(x,z,size){
  const p=new THREE.Mesh(
    new THREE.BoxGeometry(size,0.5,size),
    new THREE.MeshStandardMaterial({color:0x8a8577,roughness:0.85})
  );
  p.position.set(x,0.25,z);p.castShadow=true;p.receiveShadow=true;
  scene.add(p);
  return p;
}

const rockMats={};for(const r of ALL_ROCKS)rockMats[r.id]=new THREE.MeshStandardMaterial({
  map:rockTexture(r.id),roughness:0.95,metalness:0.02,flatShading:true
});

const xs=[-13.5,-6.75,0,6.75,13.5];
ALL_ROCKS.forEach((rt,i)=>{
  const x=xs[i];
  plinth(x,0,1.7);
  const geo=rockGeom(rt.id,7+i);
  const m=new THREE.Mesh(geo,rockMats[rt.id]);
  const s=1.5;
  m.scale.set(s*1.1,s*0.9,s*1.0);
  m.rotation.set(0.5+hash(i*5.1,i*3.3)*1.4,hash(i*2.3,i*6.1)*6.28,0.2+hash(i*8.3,i*4.9)*1.2);
  m.position.set(x,0.5+s*0.45,0);
  m.castShadow=true;m.receiveShadow=true;
  scene.add(m);
  const lbl=rockLabel(rt.id);
  lbl.position.set(x,3.6,0);
  scene.add(lbl);
  const line=leaderLine(x,0.5+s*0.9+0.2,x,lbl.position.y-1.45);
  line.position.z=0;
  scene.add(line);
});

for(let i=0;i<26;i++){
  const rt=ALL_ROCKS[(Math.random()*5)|0];
  const geo=rockGeom(rt.id,31+i);
  const m=new THREE.Mesh(geo,rockMats[rt.id]);
  const s=0.35+Math.random()*0.9;
  m.scale.set(s*1.2,s*0.85,s*1.1);
  m.rotation.set(Math.random()*6.28,Math.random()*6.28,Math.random()*6.28);
  const a=Math.random()*6.28,rad=26+Math.random()*36;
  m.position.set(Math.cos(a)*rad,s*0.4,Math.sin(a)*rad);
  m.castShadow=true;m.receiveShadow=true;
  scene.add(m);
}

placeMachine(buildBackhoe,0,9,Math.PI*0.98);
placeMachine(buildLoader,-14,10,Math.PI*0.82);
placeMachine(buildDumpTruck,14,11,Math.PI*1.12);
placeMachine(buildDrillRig,3,18,Math.PI*1.02);

const pile=new THREE.Mesh(new THREE.SphereGeometry(1.2,10,7),mat(0x7a5c3a,{roughness:1}));
pile.scale.set(1.5,0.5,1.1);pile.position.set(-1.3,0.28,6.3);
pile.castShadow=true;pile.receiveShadow=true;
scene.add(pile);

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

(function anim(){
  requestAnimationFrame(anim);
  controls.update();
  renderer.render(scene,camera);
})();
</script>
